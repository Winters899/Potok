<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Читалка (Smart Stream)</title>
  <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f3f4f6;
      --card-bg: #ffffff;
      --text: #1f2937;
      --text-light: #6b7280;
      --border: #e5e7eb;
      --error: #10b981;
      --success: #10b981;
      --highlight-bg: #4338ca;
      --highlight-border: #4338ca;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      width: 100%;
      max-width: 700px;
      transition: all 0.3s ease;
    }

    header { text-align: center; margin-bottom: 2rem; }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin: 0 0 0.5rem 0;
      color: var(--text);
    }

    p.subtitle {
      color: var(--text-light);
      font-size: 0.95rem;
      margin: 0;
      line-height: 1.5;
    }

    .control-group { margin-bottom: 1.5rem; }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
      color: var(--text);
    }

    textarea {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      resize: vertical;
      min-height: 150px;
      font-family: inherit;
      font-size: 1rem;
      box-sizing: border-box;
      transition: border-color 0.2s;
      line-height: 1.5;
    }

    textarea:focus, select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgb(1, 241, 241);
    }

    textarea:disabled { background-color: #f9fafb; color: #9ca3af; }

    select {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      background-color: white;
      font-size: 1rem;
      cursor: pointer;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 0.875rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    button:hover:not(:disabled) { background-color: var(--primary-hover); }
    button:active:not(:disabled) { transform: translateY(1px); }
    button:disabled { opacity: 0.7; cursor: not-allowed; }

    .file-input { display: none; }

    .file-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }

    .file-label {
      cursor: pointer;
      color: var(--primary);
      font-size: 0.9rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 6px;
      transition: background 0.2s;
      background: #eef2ff;
      margin: 0;
      user-select: none;
    }

    .file-label:hover { background: #e0e7ff; }

    .player-ui {
      margin-top: 20px;
      padding: 20px;
      background: #f8fafc;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      display: none;
      animation: fadeIn 0.4s ease-out;
    }

    .player-ui.active { display: block; }

    .info {
      font-size: 0.9rem;
      color: var(--text-light);
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-feature-settings: "tnum";
      font-variant-numeric: tabular-nums;
    }

    .book-view {
      background: #fff;
      padding: 2rem;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      margin-bottom: 1rem;
      font-size: 1.15rem;
      line-height: 1.6;
      min-height: 200px;
      white-space: pre-wrap;
      position: relative;

      max-height: 360px;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    /* Стили слов оставлены (на случай, если вернёшь подсветку по словам) */
    .w {
      cursor: pointer;
      border-radius: 3px;
      transition: background 0.1s;
      padding: 0 1px;
      display: inline-block;
    }
    .w:hover { background: #e0e7ff; }
    .w.active {
      background-color: #ffeb3b;
      outline: 2px solid #f59e0b;
      border-radius: 4px;
      color: #000;
      font-weight: bold;
      z-index: 10;
      position: relative;
    }

    /* Предложения */
    .s {
      cursor: pointer;
      border-radius: 3px;
      transition: background 0.1s;
      padding: 0 2px;
      display: inline;
    }
    .s:hover { background: #e0e7ff; }
    .s.active {
      background-color: #ffeb3b;
      outline: 2px solid #f59e0b;
      border-radius: 4px;
      color: #000;
      font-weight: bold;
      position: relative;
    }

    .chapter-list {
      max-height: 150px;
      overflow-y: auto;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      margin-top: 10px;
      padding: 5px;
    }

    .chapter-item {
      padding: 8px 10px;
      font-size: 0.85rem;
      border-bottom: 1px solid #f1f5f9;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-light);
      border-radius: 4px;
      user-select: none;
    }

    .chapter-item:hover { background: #f8fafc; color: var(--primary); }
    .chapter-item.active { background: #e0e7ff; color: var(--primary); font-weight: 600; }

    .progress-bar {
      height: 8px;
      background: #e2e8f0;
      border-radius: 4px;
      margin: 15px 0;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: width 0.3s ease;
    }

    audio {
      width: 100%;
      height: 40px;
      margin-bottom: 15px;
      border-radius: 8px;
    }

    .controls { display: flex; gap: 12px; }
    .controls button { padding: 0.6rem; font-size: 0.9rem; }

    .btn-secondary { background-color: #64748b; }
    .btn-secondary:hover:not(:disabled) { background-color: #475569; }

    .btn-danger { background-color: var(--error); }
    .btn-danger:hover:not(:disabled) { background-color: #dc2626; }

    .status-message {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.9rem;
      min-height: 1.4em;
      color: var(--primary);
      font-weight: 500;
    }

    .status-message.error { color: var(--error); }
    .status-message.success { color: var(--success); }

    .hint {
      font-size: 0.8rem;
      color: var(--text-light);
      text-align: right;
      margin-top: 0.4rem;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Нейро-Читалка</h1>
    <p class="subtitle">Потоковое чтение книг с синхронизацией</p>
  </header>

  <div id="inputSection">
    <div class="control-group">
      <div class="file-header">
        <label for="text" style="margin:0;">Текст для чтения</label>
        <label class="file-label">
          <span>Открыть книгу (PDF/FB2)</span>
          <input type="file" id="fileInput" class="file-input" accept=".pdf,.fb2" />
        </label>
      </div>

      <textarea id="text" placeholder="Вставьте длинный текст, главу из книги или загрузите файл..."></textarea>
      <div class="hint">Ctrl + Enter для быстрого запуска</div>
    </div>

    <div class="control-group">
      <label for="voice">Голос</label>
      <select id="voice">
        <option value="ru-RU-DmitryNeural" selected>Дмитрий (Male)</option>
        <option value="ru-RU-SvetlanaNeural">Светлана (Female)</option>
        <option value="en-US-GuyNeural">Guy (English, Male)</option>
        <option value="en-US-JennyNeural">Jenny (English, Female)</option>
      </select>
    </div>

    <button id="startBtn" type="button"><span>Начать чтение</span></button>
  </div>

  <div id="status" class="status-message"></div>

  <div id="playerUI" class="player-ui">
    <div class="info">
      <span id="chunkInfo">Фрагмент 0 / 0</span>
      <span id="preloadInfo" style="font-size:0.8rem; opacity:0.8;">Кэш: 0</span>
    </div>

    <div id="bookDisplay" class="book-view"></div>
    <div id="chapterList" class="chapter-list"></div>

    <div class="progress-bar"><div id="progress" class="progress-fill"></div></div>

    <audio id="audioPlayer" controls></audio>

    <div class="controls">
      <button id="prevBtn" class="btn-secondary" type="button">Назад</button>
      <button id="stopBtn" class="btn-danger" type="button">Стоп</button>
      <button id="nextBtn" class="btn-secondary" type="button">Вперед</button>
    </div>
  </div>
</div>

<script>
  // ========== КОНФИГУРАЦИЯ ==========
  const CHUNK_SIZE = 1500;
  const PRELOAD_AHEAD = 1;
  const SCROLL_THROTTLE_MS = 250;

  // Логи
  const DEBUG = false;
  const LOG_TIMEUPDATE_EVERY_MS = 1000;
  const LOG_HIGHLIGHT_EVERY_MS = 350;

  // ========== СОСТОЯНИЕ ==========
  let chunks = [];
  let currentChunkIndex = 0;
  let currentMarks = [];
  let adaptiveLead = 0;

  // Слова оставлены для совместимости (сейчас не подсвечиваются)
  let currentWordSpans = [];

  // Предложения
  let currentSentenceSpans = [];
  let markToSentence = [];

  let isPlaying = false;

  let lastActiveIndex = -1;             // (слова) legacy
  let lastActiveSentenceIndex = -1;     // предложения
  let markPtr = 0;
  let lastScrollAt = 0;

  let playToken = 0;

  const audioCache = new Map();
  const inFlight = new Map();
  const controllers = new Map();

  // Для измерения отставания подсветки
  let lastTimeupdateLogAt = 0;
  let lastHighlightLogAt = 0;
  let driftAvg = 0;
  let driftN = 0;

  // requestAnimationFrame loop
  let rafId = 0;
  // ========== DOM ==========
  const $ = (id) => document.getElementById(id);

  const textInput = $('text');
  const fileInput = $('fileInput');
  const startBtn = $('startBtn');
  const inputSection = $('inputSection');

  const statusEl = $('status');
  const playerUI = $('playerUI');
  const player = $('audioPlayer');

  const bookDisplay = $('bookDisplay');
  const chapterList = $('chapterList');
  const voiceSelect = $('voice');

  const chunkInfoEl = $('chunkInfo');
  const preloadInfoEl = $('preloadInfo');
  const progressEl = $('progress');

  const prevBtn = $('prevBtn');
  const nextBtn = $('nextBtn');
  const stopBtn = $('stopBtn');

  // ========== ЛОГГЕР ==========
  function ts() {
    const d = new Date();
    const hh = String(d.getHours()).padStart(2, '0');
    const mm = String(d.getMinutes()).padStart(2, '0');
    const ss = String(d.getSeconds()).padStart(2, '0');
    const ms = String(d.getMilliseconds()).padStart(3, '0');
    return `${hh}:${mm}:${ss}.${ms}`;
  }

  function log(...args) { if (DEBUG) console.log(`[${ts()}]`, ...args); }
  function warn(...args) { if (DEBUG) console.warn(`[${ts()}]`, ...args); }
  function err(...args) { if (DEBUG) console.error(`[${ts()}]`, ...args); }

  function group(title, fn) {
    if (!DEBUG) return fn?.();
    console.groupCollapsed(`[${ts()}] ${title}`);
    try { fn?.(); } finally { console.groupEnd(); }
  }

  // ========== УТИЛИТЫ ==========
  function setStatus(text, kind) {
    statusEl.textContent = text || '';
    statusEl.className = 'status-message' + (kind ? ' ' + kind : '');
    log('UI status:', { text, kind, isPlaying, currentChunkIndex, playToken });
  }

  function abortAllRequests(reason = 'abortAllRequests') {
    group(`NET abortAllRequests (${reason})`, () => {
      log('controllers.size:', controllers.size, 'inFlight.size:', inFlight.size);
    });
    controllers.forEach(c => c.abort());
    controllers.clear();
    inFlight.clear();
  }

  function clearCaches() {
    audioCache.clear();
    updateCacheInfo();
    log('CACHE cleared');
  }

  function resetHighlightState() {
    lastActiveIndex = -1;
    lastActiveSentenceIndex = -1;
    markPtr = 0;
    lastScrollAt = 0;

    lastTimeupdateLogAt = 0;
    lastHighlightLogAt = 0;
    driftAvg = 0;
    driftN = 0;

    log('HL resetHighlightState');
  }

  function updateProgressUI() {
    chunkInfoEl.textContent = `Фрагмент ${chunks.length ? (currentChunkIndex + 1) : 0} из ${chunks.length}`;
    const percent = chunks.length ? (((currentChunkIndex + 1) / chunks.length) * 100) : 0;
    progressEl.style.width = percent + "%";
  }

  function updateCacheInfo() {
    preloadInfoEl.textContent = `Кэш: ${audioCache.size}`;
  }

  function splitText(text) {
    const sentences = text.match(/[^.!?]+[.!?]+(\s|$)|[^.!?]+$/g) || [text];
    const result = [];
    let currentChunk = "";

    for (const s of sentences) {
      if (currentChunk.length + s.length > CHUNK_SIZE) {
        if (currentChunk.trim()) result.push(currentChunk.trim());
        currentChunk = s;
      } else {
        currentChunk += s;
      }
    }

    if (currentChunk.trim()) result.push(currentChunk.trim());
    return result;
  }

  function renderNavigation() {
    chapterList.innerHTML = '';
    const frag = document.createDocumentFragment();

    chunks.forEach((chunk, idx) => {
      const div = document.createElement('div');
      div.className = 'chapter-item';
      div.dataset.idx = String(idx);
      div.id = `nav-item-${idx}`;
      div.textContent = `${idx + 1}. ${chunk.substring(0, 60)}...`;
      frag.appendChild(div);
    });

    chapterList.appendChild(frag);
    log('NAV renderNavigation:', { chunks: chunks.length });
  }

  function setNavActive(index) {
    document.querySelectorAll('.chapter-item.active').forEach(el => el.classList.remove('active'));
    const navItem = document.getElementById(`nav-item-${index}`);
    if (navItem) {
      navItem.classList.add('active');
      navItem.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }

  function findMarkIndexByTime(t) {
    const a = currentMarks;
    let lo = 0, hi = a.length - 1, ans = -1;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      if (a[mid].offset <= t) { ans = mid; lo = mid + 1; }
      else hi = mid - 1;
    }
    return ans;
  }

  function inferOffsetUnit(marks) {
    if (!Array.isArray(marks) || !marks.length) return { kind: 'none', div: 1 };
    const max = marks[marks.length - 1]?.offset;
    if (!Number.isFinite(max)) return { kind: 'unknown', div: 1 };

    if (max > 1e6) return { kind: 'ticks_100ns?', div: 1e7 };
    if (max > 1e3) return { kind: 'ms?', div: 1e3 };
    return { kind: 'seconds?', div: 1 };
  }

  function normalizeMarksToSeconds(data) {
    const marks = Array.isArray(data?.marks) ? data.marks : [];
    if (!marks.length) return data;

    const { kind, div } = inferOffsetUnit(marks);

    if (div === 1) {
      data._offsetUnit = kind;
      return data;
    }

    data._offsetUnit = kind;
    data.marks = marks.map(m => ({ ...m, offset: m.offset / div }));
    return data;
  }

  function segmentSentences(text) {
    // Prefer Intl.Segmenter when available
    if (window.Intl && Intl.Segmenter) {
      const seg = new Intl.Segmenter('ru', { granularity: 'sentence' });
      return Array.from(seg.segment(text)).map(x => ({
        start: x.index,
        end: x.index + x.segment.length,
        text: x.segment
      }));
    }

    // Fallback regex
    const re = /[^.!?]+[.!?]+(\s|$)|[^.!?]+$/g;
    const out = [];
    let m;
    while ((m = re.exec(text)) !== null) {
      out.push({ start: m.index, end: m.index + m[0].length, text: m[0] });
    }
    return out.length ? out : [{ start: 0, end: text.length, text }];
  }

  function ensureVisible(el) {
    const p = bookDisplay.getBoundingClientRect();
    const r = el.getBoundingClientRect();
    if (r.top < p.top || r.bottom > p.bottom) {
      el.scrollIntoView({ block: 'nearest' });
    }
  }

  // ========== РЕНДЕР ТЕКСТА (ПРЕДЛОЖЕНИЯ) ==========
  function renderInteractiveText(text, marks) {
    bookDisplay.innerHTML = '';
    currentWordSpans = [];

    currentSentenceSpans = [];
    markToSentence = [];
    lastActiveSentenceIndex = -1;

    const sentences = segmentSentences(text);
    const frag = document.createDocumentFragment();

    for (let si = 0; si < sentences.length; si++) {
      const span = document.createElement('span');
      span.className = 's';
      span.dataset.s = String(si);
      span.textContent = sentences[si].text;
      frag.appendChild(span);
      currentSentenceSpans.push(span);
    }

    bookDisplay.appendChild(frag);
    bookDisplay.scrollTop = 0;

    if (Array.isArray(marks) && marks.length) {
      let si = 0;
      for (let i = 0; i < marks.length; i++) {
        const off = marks[i].text_offset;
        while (si + 1 < sentences.length && off >= sentences[si].end) si++;
        markToSentence[i] = si;
      }
    }
  }

  // ========== СЕТЬ ==========
  let reqSeq = 0;

  async function fetchAudio(index) {
    if (index < 0 || index >= chunks.length) return null;

    if (audioCache.has(index)) {
      log('NET fetchAudio cache HIT:', { index });
      return audioCache.get(index);
    }

    if (inFlight.has(index)) {
      log('NET fetchAudio inFlight HIT:', { index });
      return inFlight.get(index);
    }

    const reqId = ++reqSeq;
    const voice = voiceSelect.value;
    const text = chunks[index] || '';
    const bodyPreview = text.slice(0, 80).replace(/\s+/g, ' ');

    const promise = (async () => {
      controllers.get(index)?.abort();
      const controller = new AbortController();
      controllers.set(index, controller);

      group(`NET /speak START #${reqId} (index=${index + 1})`, () => {
        log('params:', { index, voice, textLen: text.length, preview: bodyPreview });
      });

      const t0 = performance.now();

      try {
        const response = await fetch('/speak', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          signal: controller.signal,
          body: JSON.stringify({ text, voice })
        });

        const t1 = performance.now();
        log(`NET /speak HTTP #${reqId}:`, { ok: response.ok, status: response.status, ms: Math.round(t1 - t0) });

        if (!response.ok) throw new Error('Ошибка сети или сервера');

        const t2 = performance.now();
        let data = await response.json();
        const t3 = performance.now();

        data = normalizeMarksToSeconds(data);

        audioCache.set(index, data);
        updateCacheInfo();

        group(`NET /speak OK #${reqId} (index=${index + 1})`, () => {
          const marks = Array.isArray(data.marks) ? data.marks : [];
          log('timing:', {
            fetchMs: Math.round(t1 - t0),
            jsonMs: Math.round(t3 - t2),
            totalMs: Math.round(t3 - t0)
          });
          log('response:', {
            hasAudioUrl: !!data.audio_url,
            audioUrl: data.audio_url,
            marksCount: marks.length,
            offsetUnit: data._offsetUnit || 'n/a',
            m0: marks[0],
            m1: marks[1],
            last: marks[marks.length - 1]
          });
        });

        return data;
      } catch (e) {
        if (e && e.name === 'AbortError') {
          warn(`NET /speak ABORTED #${reqId} (index=${index + 1})`);
          return null;
        }
        err(`NET /speak FAIL #${reqId} (index=${index + 1})`, e);
        throw e;
      } finally {
        inFlight.delete(index);
      }
    })();

    inFlight.set(index, promise);

    try {
      return await promise;
    } catch (e) {
      return null;
    }
  }

  // ========== ПРОИГРЫВАНИЕ ==========
  async function playChunk(index) {
    if (!isPlaying) return;

    if (index < 0 || index >= chunks.length) {
      if (index >= chunks.length) setStatus('Книга прочитана до конца!', 'success');
      return;
    }

    const myToken = ++playToken;

    group(`PLAY playChunk START (index=${index + 1}, token=${myToken})`, () => {
      log('state before:', {
        isPlaying,
        currentChunkIndex,
        chunks: chunks.length,
        cacheSize: audioCache.size,
        inFlight: inFlight.size
      });
    });

    currentChunkIndex = index;
    resetHighlightState();
    updateProgressUI();
    setNavActive(index);

    setStatus(`Генерация фрагмента ${index + 1}...`, '');

    const data = audioCache.get(index) || await fetchAudio(index);

    if (myToken !== playToken) {
      warn('PLAY playChunk stale token -> exit', { myToken, playToken, index });
      return;
    }

    if (!data) {
      setStatus(`Не удалось загрузить часть ${index + 1}.`, 'error');
      return;
    }

    currentMarks = Array.isArray(data.marks) ? data.marks : [];
    renderInteractiveText(chunks[index], currentMarks);

    player.src = data.audio_url;

    group(`PLAY set src (index=${index + 1})`, () => {
      log('audio_url:', data.audio_url);
      log('marks:', { count: currentMarks.length, offsetUnit: data._offsetUnit || 'n/a' });
    });

    setStatus(`Читаю фрагмент ${index + 1}...`, '');

    try {
      await player.play();
      log('AUDIO play() resolved', { index: index + 1 });
    } catch (e) {
      warn('AUDIO play() rejected', e);
      setStatus('Автозапуск заблокирован браузером. Нажмите Play.', '');
    }

    for (let k = 1; k <= PRELOAD_AHEAD; k++) {
      const nextIdx = index + k;
      if (nextIdx < chunks.length) fetchAudio(nextIdx);
    }
  }

  function nextChunk() { playChunk(currentChunkIndex + 1); }
  function prevChunk() { playChunk(currentChunkIndex - 1); }

  function stopReading() {
    group('STOP stopReading()', () => {
      log('state:', { isPlaying, playToken, currentChunkIndex, cacheSize: audioCache.size });
    });

    isPlaying = false;
    playToken++;

    player.pause();
    player.src = "";

    if (rafId) cancelAnimationFrame(rafId);
    rafId = 0;
    playerUI.classList.remove('active');
    inputSection.style.display = 'block';

    abortAllRequests('stopReading');
    clearCaches();

    setStatus('Чтение остановлено.', '');
  }

  // ========== ЗАГРУЗКА ФАЙЛА ==========
  async function uploadFile(input) {
    if (!input.files || !input.files[0]) return;

    const file = input.files[0];
    const formData = new FormData();
    formData.append('file', file);

    group('FILE uploadFile()', () => {
      log('file:', { name: file.name, size: file.size, type: file.type });
    });

    setStatus('Извлечение текста, подождите...', '');
    textInput.disabled = true;
    startBtn.disabled = true;

    const t0 = performance.now();

    try {
      const res = await fetch('/extract_text', { method: 'POST', body: formData });
      const t1 = performance.now();
      const data = await res.json();
      const t2 = performance.now();

      group('FILE /extract_text response', () => {
        log('timing:', { fetchMs: Math.round(t1 - t0), jsonMs: Math.round(t2 - t1), totalMs: Math.round(t2 - t0) });
        log('http:', { ok: res.ok, status: res.status });
        log('keys:', Object.keys(data || {}));
      });

      if (!res.ok) throw new Error(data.error || 'Ошибка обработки файла');

      textInput.value = data.text || '';
      setStatus(`Успешно загружено! Символов: ${textInput.value.length}`, 'success');

      setTimeout(() => { if (!isPlaying) setStatus('', ''); }, 3000);
    } catch (e) {
      err('FILE upload error', e);
      setStatus('Ошибка: ' + (e?.message || e), 'error');
    } finally {
      textInput.disabled = false;
      startBtn.disabled = false;
      input.value = '';
    }
  }

  // ========== СТАРТ ==========
  async function startReading() {
    const text = textInput.value.trim();
    if (!text) {
      setStatus('Введите текст или загрузите книгу!', 'error');
      textInput.focus();
      return;
    }

    chunks = splitText(text);
    if (!chunks.length) return;

    group('START startReading()', () => {
      log('input:', { textLen: text.length, chunks: chunks.length, CHUNK_SIZE });
    });

    playToken++;
    abortAllRequests('startReading reset');
    clearCaches();

    currentChunkIndex = 0;
    isPlaying = true;

    renderNavigation();

    inputSection.style.display = 'none';
    playerUI.classList.add('active');

    setStatus('Подготовка аудиопотока...', '');
    updateProgressUI();
    updateCacheInfo();

    await playChunk(0);
  }

  // ========== UI события ==========
  startBtn.addEventListener('click', startReading);
  prevBtn.addEventListener('click', prevChunk);
  nextBtn.addEventListener('click', nextChunk);
  stopBtn.addEventListener('click', stopReading);
  fileInput.addEventListener('change', (e) => uploadFile(e.target));

  textInput.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      e.preventDefault();
      startReading();
    }
  });

  chapterList.addEventListener('click', (e) => {
    const item = e.target.closest('.chapter-item');
    if (!item) return;
    const idx = Number(item.dataset.idx);
    log('NAV click:', { idx });
    if (Number.isFinite(idx)) playChunk(idx);
  });

  // Клик по предложению: перейти к его началу
  bookDisplay.addEventListener('click', (e) => {
    const el = e.target.closest('.s');
    if (!el) return;

    const sidx = Number(el.dataset.s);
    if (!Number.isFinite(sidx)) return;

    log('SENT click:', { sidx, hasMarks: !!currentMarks.length, t: player.currentTime, dur: player.duration });

    if (currentMarks.length && markToSentence.length) {
      const first = markToSentence.findIndex(v => v === sidx);
      if (first !== -1) {
        const t0 = currentMarks[first]?.offset;
        if (typeof t0 === 'number') {
          player.currentTime = t0;
          player.play().catch(() => {});
        }
      }
      return;
    }

    if (player.duration > 0 && currentSentenceSpans.length) {
      player.currentTime = player.duration * (sidx / currentSentenceSpans.length);
      player.play().catch(() => {});
    }
  });

  voiceSelect.addEventListener('change', () => {
    log('VOICE changed:', { voice: voiceSelect.value, isPlaying, currentChunkIndex });
    if (!isPlaying || !chunks.length) return;

    playToken++;
    abortAllRequests('voice change');
    clearCaches();
    resetHighlightState();

    setStatus('Голос изменён — перегенерирую текущий фрагмент...', '');
    playChunk(currentChunkIndex);
  });

  // ========== Media события ==========
  function logMedia(ev) {
    log(`AUDIO ${ev}:`, {
      t: Number.isFinite(player.currentTime) ? player.currentTime.toFixed(3) : player.currentTime,
      dur: Number.isFinite(player.duration) ? player.duration.toFixed(3) : player.duration,
      readyState: player.readyState,
      networkState: player.networkState,
      paused: player.paused
    });
  }

  ['loadedmetadata','canplay','canplaythrough','playing','pause','ended','seeking','seeked','stalled','waiting','error'].forEach(ev => {
    player.addEventListener(ev, () => logMedia(ev));
  });

  player.addEventListener('playing', () => {
    if (!rafId) rafId = requestAnimationFrame(highlightFrame);
  });

  player.addEventListener('pause', () => {
    if (rafId) cancelAnimationFrame(rafId);
    rafId = 0;
  });

  player.addEventListener('ended', () => {
    if (rafId) cancelAnimationFrame(rafId);
    rafId = 0;
    if (isPlaying) playChunk(currentChunkIndex + 1);
  });

  function highlightFrame() {
    if (!isPlaying || player.paused || player.ended) {
      rafId = 0;
      return;
    }

    const t = player.currentTime;
    const tt = t + adaptiveLead;


    let wordIdx = -1;

    if (currentMarks.length) {
      if (markPtr < currentMarks.length && tt < currentMarks[markPtr]?.offset) {
        markPtr = Math.max(0, findMarkIndexByTime(tt));
      } else {
        while (
          markPtr + 1 < currentMarks.length &&
          tt >= currentMarks[markPtr + 1].offset
        ) {
          markPtr++;
        }
      }
      wordIdx = Math.min(markPtr, currentMarks.length - 1);
      // --- автокоррекция рассинхрона ---
      const m = currentMarks[wordIdx];
      if (m && typeof m.offset === 'number') {
        const drift = tt - m.offset;   // + = подсветка позже звука
        driftN++;
        driftAvg += (drift - driftAvg) / driftN;

        adaptiveLead -= drift * 0.12;  // коэффициент подобран
        adaptiveLead = Math.max(-0.4, Math.min(0.6, adaptiveLead));
      }
    }

    let sidx = -1;
    if (currentMarks.length) {
      if (wordIdx !== -1) {
        sidx = markToSentence[wordIdx] ?? -1;
      }
    } else if (currentSentenceSpans.length && player.duration > 0) {
      sidx = Math.floor((tt / player.duration) * currentSentenceSpans.length);
      sidx = Math.max(0, Math.min(sidx, currentSentenceSpans.length - 1));
    }

    if (sidx !== -1 && sidx !== lastActiveSentenceIndex) {
      if (lastActiveSentenceIndex !== -1) {
        currentSentenceSpans[lastActiveSentenceIndex]?.classList.remove('active');
      }

      lastActiveSentenceIndex = sidx;
      const el = currentSentenceSpans[sidx];
      if (el) {
        el.classList.add('active');

        const now = performance.now();
        if (now - lastScrollAt > SCROLL_THROTTLE_MS) {
          ensureVisible(el);
          lastScrollAt = now;
        }
      }
    }

    rafId = requestAnimationFrame(highlightFrame);
  }

  // ========== Экспорт ==========
  window.startReading = startReading;
  window.stopReading = stopReading;
  window.nextChunk = nextChunk;
  window.prevChunk = prevChunk;
  window.playChunk = playChunk;
  window.uploadFile = uploadFile;

  window._dbg = {
    get chunks() { return chunks; },
    get currentMarks() { return currentMarks; },
    get audioCache() { return audioCache; },
    get inFlight() { return inFlight; },
    get controllers() { return controllers; },
    player,
    inferOffsetUnit,
  };

  log('READY debug helpers: window._dbg (chunks/currentMarks/audioCache/...)');
</script>

</body>
</html>
