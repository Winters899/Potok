<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Читалка (Smart Stream)</title>
  <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f3f4f6;
      --card-bg: #ffffff;
      --text: #1f2937;
      --text-light: #6b7280;
      --border: #e5e7eb;
      --error: #10b981;
      --success: #10b981;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      width: 100%;
      max-width: 700px;
      transition: all 0.3s ease;
    }

    header { text-align: center; margin-bottom: 2rem; }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin: 0 0 0.5rem 0;
      color: var(--text);
    }

    p.subtitle {
      color: var(--text-light);
      font-size: 0.95rem;
      margin: 0;
      line-height: 1.5;
    }

    .control-group { margin-bottom: 1.5rem; }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
      color: var(--text);
    }

    textarea {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      resize: vertical;
      min-height: 150px;
      font-family: inherit;
      font-size: 1rem;
      box-sizing: border-box;
      transition: border-color 0.2s;
      line-height: 1.5;
    }

    textarea:focus, select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgb(1, 241, 241);
    }

    textarea:disabled { background-color: #f9fafb; color: #9ca3af; }

    select {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      background-color: white;
      font-size: 1rem;
      cursor: pointer;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 0.875rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    button:hover:not(:disabled) { background-color: var(--primary-hover); }
    button:active:not(:disabled) { transform: translateY(1px); }
    button:disabled { opacity: 0.7; cursor: not-allowed; }

    .file-input { display: none; }

    .file-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }

    .file-label {
      cursor: pointer;
      color: var(--primary);
      font-size: 0.9rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 6px;
      transition: background 0.2s;
      background: #eef2ff;
      margin: 0;
      user-select: none;
    }

    .file-label:hover { background: #e0e7ff; }

    .player-ui {
      margin-top: 20px;
      padding: 20px;
      background: #f8fafc;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      display: none;
      animation: fadeIn 0.4s ease-out;
    }

    .player-ui.active { display: block; }

    .info {
      font-size: 0.9rem;
      color: var(--text-light);
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-feature-settings: "tnum";
      font-variant-numeric: tabular-nums;
    }

    .book-view {
      background: #fff;
      padding: 2rem;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      margin-bottom: 1rem;
      font-size: 1.15rem;
      line-height: 1.6;
      min-height: 200px;
      white-space: pre-wrap;
      position: relative;
      max-height: 360px;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    .w {
      cursor: pointer;
      border-radius: 3px;
      transition: background 0.1s;
      padding: 0 1px;
      display: inline-block;
    }
    .w:hover { background: #e0e7ff; }
    .w.active {
      background-color: #ffeb3b;
      outline: 2px solid #f59e0b;
      border-radius: 4px;
      color: #000;
      font-weight: bold;
      position: relative;
      z-index: 10;
    }

    .chapter-list {
      max-height: 150px;
      overflow-y: auto;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      margin-top: 10px;
      padding: 5px;
    }

    .chapter-item {
      padding: 8px 10px;
      font-size: 0.85rem;
      border-bottom: 1px solid #f1f5f9;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-light);
      border-radius: 4px;
      user-select: none;
    }

    .chapter-item:hover { background: #f8fafc; color: var(--primary); }
    .chapter-item.active { background: #e0e7ff; color: var(--primary); font-weight: 600; }

    .progress-bar {
      height: 8px;
      background: #e2e8f0;
      border-radius: 4px;
      margin: 15px 0;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: width 0.3s ease;
    }

    audio {
      width: 100%;
      height: 40px;
      margin-bottom: 15px;
      border-radius: 8px;
    }

    .controls { display: flex; gap: 12px; }
    .controls button { padding: 0.6rem; font-size: 0.9rem; }

    .btn-secondary { background-color: #64748b; }
    .btn-secondary:hover:not(:disabled) { background-color: #475569; }

    .btn-danger { background-color: var(--error); }
    .btn-danger:hover:not(:disabled) { background-color: #dc2626; }

    .status-message {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.9rem;
      min-height: 1.4em;
      color: var(--primary);
      font-weight: 500;
    }

    .status-message.error { color: var(--error); }
    .status-message.success { color: var(--success); }

    .hint {
      font-size: 0.8rem;
      color: var(--text-light);
      text-align: right;
      margin-top: 0.4rem;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Нейро-Читалка</h1>
    <p class="subtitle">Потоковое чтение книг с синхронизацией</p>
  </header>

  <div id="inputSection">
    <div class="control-group">
      <div class="file-header">
        <label for="text" style="margin:0;">Текст для чтения</label>
        <label class="file-label">
          <span>Открыть книгу (PDF/FB2)</span>
          <input type="file" id="fileInput" class="file-input" accept=".pdf,.fb2" />
        </label>
      </div>

      <textarea id="text" placeholder="Вставьте длинный текст, главу из книги или загрузите файл..."></textarea>
      <div class="hint">Ctrl + Enter для быстрого запуска</div>
    </div>

    <div class="control-group">
      <label for="voice">Голос</label>
      <select id="voice">
        <option value="ru-RU-DmitryNeural" selected>Дмитрий (Male)</option>
        <option value="ru-RU-SvetlanaNeural">Светлана (Female)</option>
        <option value="en-US-GuyNeural">Guy (English, Male)</option>
        <option value="en-US-JennyNeural">Jenny (English, Female)</option>
      </select>
    </div>

    <button id="startBtn" type="button"><span>Начать чтение</span></button>
  </div>

  <div id="status" class="status-message"></div>

  <div id="playerUI" class="player-ui">
    <div class="info">
      <span id="chunkInfo">Фрагмент 0 / 0</span>
      <span id="preloadInfo" style="font-size:0.8rem; opacity:0.8;">Кэш: 0</span>
    </div>

    <div id="bookDisplay" class="book-view"></div>
    <div id="chapterList" class="chapter-list"></div>

    <div class="progress-bar"><div id="progress" class="progress-fill"></div></div>

    <audio id="audioPlayer" controls></audio>

    <div class="controls">
      <button id="prevBtn" class="btn-secondary" type="button">Назад</button>
      <button id="stopBtn" class="btn-danger" type="button">Стоп</button>
      <button id="nextBtn" class="btn-secondary" type="button">Вперед</button>
    </div>
  </div>
</div>

<script>
  // ===== КОНФИГ =====
  const CHUNK_SIZE = 1500;
  const PRELOAD_AHEAD = 1;
  const SCROLL_THROTTLE_MS = 250;
  const DEBUG = false;

  // небольшой опережающий сдвиг подсветки (подбирается на слух)
  let HIGHLIGHT_LEAD = 0.18; // 180 мс вперёд [web:47]

  // ===== СОСТОЯНИЕ =====
  let chunks = [];
  let currentChunkIndex = 0;
  let currentMarks = [];

  let currentWordSpans = [];
  let isPlaying = false;
  let lastActiveWordIndex = -1;
  let lastScrollAt = 0;
  let playToken = 0;

  const audioCache = new Map();
  const inFlight = new Map();
  const controllers = new Map();
  let rafId = 0;
  let reqSeq = 0;

  // ===== DOM =====
  const $ = (id) => document.getElementById(id);

  const textInput    = $('text');
  const fileInput    = $('fileInput');
  const startBtn     = $('startBtn');
  const inputSection = $('inputSection');

  const statusEl   = $('status');
  const playerUI   = $('playerUI');
  const player     = $('audioPlayer');
  const bookDisplay= $('bookDisplay');
  const chapterList= $('chapterList');
  const voiceSelect= $('voice');

  const chunkInfoEl   = $('chunkInfo');
  const preloadInfoEl = $('preloadInfo');
  const progressEl    = $('progress');

  const prevBtn = $('prevBtn');
  const nextBtn = $('nextBtn');
  const stopBtn = $('stopBtn');

  // ===== ЛОГ =====
  function log(...args)   { if (DEBUG) console.log(...args); }
  function warn(...args)  { if (DEBUG) console.warn(...args); }
  function err(...args)   { if (DEBUG) console.error(...args); }

// ===== ПРОГРЕСС (localStorage) =====
  const PROGRESS_KEY = "neuro_reader_progress_v1";

  function saveProgress() {
    if (!chunks.length || !isPlaying) return;
    const payload = {
      text: textInput.value,
      voice: voiceSelect.value,
      chunk_index: currentChunkIndex,
      position: player.currentTime
    };
    try {
      localStorage.setItem(PROGRESS_KEY, JSON.stringify(payload));
    } catch (e) {
      err("saveProgress failed", e);
    }
  }

  function loadProgress() {
    try {
      const raw = localStorage.getItem(PROGRESS_KEY);
      if (!raw) return null;
      return JSON.parse(raw);
    } catch (e) {
      err("loadProgress failed", e);
      return null;
    }
  }

  // ===== УТИЛИТЫ =====
  function setStatus(text, kind) {
    statusEl.textContent = text || '';
    statusEl.className = 'status-message' + (kind ? ' ' + kind : '');
  }

  function abortAllRequests() {
    controllers.forEach(c => c.abort());
    controllers.clear();
    inFlight.clear();
  }

  function clearCaches() {
    audioCache.clear();
    updateCacheInfo();
  }

  function resetHighlightState() {
    lastActiveWordIndex = -1;
    lastScrollAt = 0;
  }

  function updateProgressUI() {
    chunkInfoEl.textContent = `Фрагмент ${chunks.length ? (currentChunkIndex + 1) : 0} из ${chunks.length}`;
    const percent = chunks.length ? (((currentChunkIndex + 1) / chunks.length) * 100) : 0;
    progressEl.style.width = percent + '%';
  }

  function updateCacheInfo() {
    preloadInfoEl.textContent = `Кэш: ${audioCache.size}`;
  }

  function splitText(text) {
    const sentences = text.match(/[^.!?]+[.!?]+(\s|$)|[^.!?]+$/g) || [text];
    const result = [];
    let currentChunk = '';

    for (const s of sentences) {
      if (currentChunk.length + s.length > CHUNK_SIZE) {
        if (currentChunk.trim()) result.push(currentChunk.trim());
        currentChunk = s;
      } else {
        currentChunk += s;
      }
    }
    if (currentChunk.trim()) result.push(currentChunk.trim());
    return result;
  }

  function renderNavigation() {
    chapterList.innerHTML = '';
    const frag = document.createDocumentFragment();

    chunks.forEach((chunk, idx) => {
      const div = document.createElement('div');
      div.className = 'chapter-item';
      div.dataset.idx = String(idx);
      div.id = `nav-item-${idx}`;
      div.textContent = `${idx + 1}. ${chunk.substring(0, 60)}...`;
      frag.appendChild(div);
    });

    chapterList.appendChild(frag);
  }

  function setNavActive(index) {
    document.querySelectorAll('.chapter-item.active')
      .forEach(el => el.classList.remove('active'));
    const navItem = document.getElementById(`nav-item-${index}`);
    if (navItem) {
      navItem.classList.add('active');
      navItem.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }

  function findMarkIndexByTime(t) {
    const a = currentMarks;
    let lo = 0, hi = a.length - 1, ans = -1;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      if (a[mid].offset <= t) { ans = mid; lo = mid + 1; }
      else hi = mid - 1;
    }
    return ans;
  }

  function inferOffsetUnit(marks) {
    if (!Array.isArray(marks) || !marks.length) return { kind: 'none', div: 1 };
    const max = marks[marks.length - 1]?.offset;
    if (!Number.isFinite(max)) return { kind: 'unknown', div: 1 };
    if (max > 1e6) return { kind: 'ticks_100ns?', div: 1e7 };
    if (max > 1e3) return { kind: 'ms?', div: 1e3 };
    return { kind: 'seconds?', div: 1 };
  }

  function normalizeMarksToSeconds(data) {
    const marks = Array.isArray(data?.marks) ? data.marks : [];
    if (!marks.length) return data;

    const { div } = inferOffsetUnit(marks);
    if (div === 1) return data;

    data.marks = marks.map(m => ({ ...m, offset: m.offset / div }));
    return data;
  }

  // подгоняем marks под фактическую длину аудио, чтобы убрать накопленный дрейф [web:45]
  function rescaleMarksToDuration() {
    if (!currentMarks.length || !Number.isFinite(player.duration) || player.duration <= 0) return;

    const last = currentMarks[currentMarks.length - 1].offset;
    if (!Number.isFinite(last) || last <= 0) return;

    const scale = player.duration / last;
    if (Math.abs(1 - scale) < 0.02) return; // меньше 2% — можно не трогать

    currentMarks = currentMarks.map(m => ({
      ...m,
      offset: m.offset * scale
    }));
  }

  function ensureVisible(el) {
    const p = bookDisplay.getBoundingClientRect();
    const r = el.getBoundingClientRect();
    if (r.top < p.top || r.bottom > p.bottom) {
      el.scrollIntoView({ block: 'nearest' });
    }
  }

  // ===== СЕТЬ =====
  async function fetchAudio(index) {
    if (index < 0 || index >= chunks.length) return null;

    if (audioCache.has(index)) return audioCache.get(index);
    if (inFlight.has(index))  return inFlight.get(index);

    const reqId = ++reqSeq;
    const voice = voiceSelect.value;
    const text  = chunks[index] || '';

    const promise = (async () => {
      controllers.get(index)?.abort();
      const controller = new AbortController();
      controllers.set(index, controller);

      try {
        const response = await fetch('/speak', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          signal: controller.signal,
          body: JSON.stringify({ text, voice })
        });

        if (!response.ok) throw new Error('Ошибка сети или сервера');

        let data = await response.json();
        data = normalizeMarksToSeconds(data);

        audioCache.set(index, data);
        updateCacheInfo();
        return data;
      } catch (e) {
        if (e && e.name === 'AbortError') return null;
        err(`NET /speak FAIL #${reqId} (index=${index + 1})`, e);
        throw e;
      } finally {
        inFlight.delete(index);
      }
    })();

    inFlight.set(index, promise);
    try {
      return await promise;
    } catch {
      return null;
    }
  }

  // ===== РЕНДЕР ТЕКСТА (ПО СЛОВАМ) =====
  function renderInteractiveText(text) {
    bookDisplay.innerHTML = '';
    currentWordSpans = [];
    lastActiveWordIndex = -1;

    const words = text.split(/\s+/);
    const frag = document.createDocumentFragment();

    words.forEach((w, wi) => {
      const span = document.createElement('span');
      span.className = 'w';
      span.dataset.w = wi;
      span.textContent = w + ' ';
      frag.appendChild(span);
      currentWordSpans.push(span);
    });

    bookDisplay.appendChild(frag);
    bookDisplay.scrollTop = 0;
  }

  // ===== FRAME LOOP (ПОДСВЕТКА) =====
  function highlightFrame() {
    if (!isPlaying || player.paused || player.ended) {
      rafId = 0;
      return;
    }

    // учитываем опережающий сдвиг [web:47]
    const t = player.currentTime + HIGHLIGHT_LEAD;
    let idx = -1;

    if (currentMarks.length) {
      idx = findMarkIndexByTime(t);
    } else if (currentWordSpans.length && player.duration > 0) {
      idx = Math.floor((t / player.duration) * currentWordSpans.length);
      idx = Math.max(0, Math.min(idx, currentWordSpans.length - 1));
    }

    if (idx !== -1 && idx !== lastActiveWordIndex) {
      if (lastActiveWordIndex !== -1) {
        currentWordSpans[lastActiveWordIndex]?.classList.remove('active');
      }
      lastActiveWordIndex = idx;
      const el = currentWordSpans[idx];
      if (el) {
        const now = performance.now();
        if (now - lastScrollAt > SCROLL_THROTTLE_MS) {
          ensureVisible(el);
          lastScrollAt = now;
        }
        el.classList.add('active');
      }
    }

    rafId = requestAnimationFrame(highlightFrame);
  }

  // ===== ПРОИГРЫВАНИЕ =====
  async function playChunk(index) {
    if (!isPlaying) return;
    if (index < 0 || index >= chunks.length) {
      if (index >= chunks.length) setStatus('Книга прочитана до конца!', 'success');
      return;
    }

    const myToken = ++playToken;
    currentChunkIndex = index;
    resetHighlightState();
    updateProgressUI();
    setNavActive(index);
    setStatus(`Генерация фрагмента ${index + 1}...`, '');

    const data = audioCache.get(index) || await fetchAudio(index);
    if (myToken !== playToken) return;
    if (!data) {
      setStatus(`Не удалось загрузить часть ${index + 1}.`, 'error');
      return;
    }

    currentMarks = Array.isArray(data.marks) ? data.marks : [];
    renderInteractiveText(chunks[index]);

    // ставим src и после загрузки метаданных нормализуем метки [web:45]
    player.src = data.audio_url;
    player.onloadedmetadata = () => {
      rescaleMarksToDuration();

      // если есть сохранённый прогресс и это тот же chunk — восстановим позицию
      const saved = loadProgress();
      if (saved &&
          Number.isFinite(saved.position) &&
          saved.chunk_index === currentChunkIndex) {
        try {
          player.currentTime = saved.position;
        } catch (e) {
          err("restore position failed", e);
        }
      }
    };

    setStatus(`Читаю фрагмент ${index + 1}...`, '');

    try {
      await player.play();
    } catch {
      setStatus('Автозапуск заблокирован браузером. Нажмите Play.', '');
    }

    for (let k = 1; k <= PRELOAD_AHEAD; k++) {
      const nextIdx = index + k;
      if (nextIdx < chunks.length) fetchAudio(nextIdx);
    }
  }

  function nextChunk() { playChunk(currentChunkIndex + 1); }
  function prevChunk() { playChunk(currentChunkIndex - 1); }

  function stopReading() {
    isPlaying = false;
    playToken++;

    player.pause();
    player.src = '';

    if (rafId) cancelAnimationFrame(rafId);
    rafId = 0;

    playerUI.classList.remove('active');
    inputSection.style.display = 'block';

    abortAllRequests();
    clearCaches();
    setStatus('Чтение остановлено.', '');
    // прогресс остаётся в localStorage
  }

  // ===== ЗАГРУЗКА ФАЙЛА =====
  async function uploadFile(input) {
    if (!input.files || !input.files[0]) return;

    const file = input.files[0];
    const formData = new FormData();
    formData.append('file', file);

    setStatus('Извлечение текста, подождите...', '');
    textInput.disabled = true;
    startBtn.disabled = true;

    try {
      const res = await fetch('/extract_text', { method: 'POST', body: formData });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Ошибка обработки файла');

      textInput.value = data.text || '';
      setStatus(`Успешно загружено! Символов: ${textInput.value.length}`, 'success');
      setTimeout(() => { if (!isPlaying) setStatus('', ''); }, 3000);
    } catch (e) {
      err('FILE upload error', e);
      setStatus('Ошибка: ' + (e?.message || e), 'error');
    } finally {
      textInput.disabled = false;
      startBtn.disabled = false;
      input.value = '';
    }
  }

  // ===== СТАРТ =====
  async function startReading() {
    const text = textInput.value.trim();
    if (!text) {
      setStatus('Введите текст или загрузите книгу!', 'error');
      textInput.focus();
      return;
    }

    chunks = splitText(text);
    if (!chunks.length) return;

    playToken++;
    abortAllRequests();
    clearCaches();

    currentChunkIndex = 0;
    isPlaying = true;

    renderNavigation();

    inputSection.style.display = 'none';
    playerUI.classList.add('active');

    setStatus('Подготовка аудиопотока...', '');
    updateProgressUI();
    updateCacheInfo();

    await playChunk(0);
  }

  // ===== UI события =====
  startBtn.addEventListener('click', startReading);
  prevBtn.addEventListener('click', prevChunk);
  nextBtn.addEventListener('click', nextChunk);
  stopBtn.addEventListener('click', stopReading);
  fileInput.addEventListener('change', (e) => uploadFile(e.target));

  textInput.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      e.preventDefault();
      startReading();
    }
  });

  chapterList.addEventListener('click', (e) => {
    const item = e.target.closest('.chapter-item');
    if (!item) return;
    const idx = Number(item.dataset.idx);
    if (Number.isFinite(idx)) playChunk(idx);
  });

  // ===== Media события (драйвим RAF) =====
  player.addEventListener('playing', () => {
    if (!rafId) rafId = requestAnimationFrame(highlightFrame);
    // запускаем периодическое сохранение прогресса
    saveProgress();
  });

  player.addEventListener('pause', () => {
    if (rafId) cancelAnimationFrame(rafId);
    rafId = 0;
  });

  player.addEventListener('ended', () => {
    if (rafId) cancelAnimationFrame(rafId);
    rafId = 0;
    if (isPlaying) playChunk(currentChunkIndex + 1);
  });


  // периодически сохраняем прогресс во время воспроизведения
  setInterval(() => {
    if (!player.paused && !player.ended) {
      saveProgress();
    }
  }, 3000);

  window.addEventListener('load', async () => {
    const p = loadProgress();
    if (!p || !p.text) return;

    // восстановить текст и голос
    textInput.value = p.text;
    if (p.voice) voiceSelect.value = p.voice;

    // подготовить chunks
    chunks = splitText(p.text);
    if (!chunks.length) return;

    renderNavigation();

    if (Number.isFinite(p.chunk_index) &&
        p.chunk_index >= 0 &&
        p.chunk_index < chunks.length) {
      currentChunkIndex = p.chunk_index;
      setNavActive(currentChunkIndex);
    }

    // сразу переходим в режим плеера и запускаем нужный фрагмент
    inputSection.style.display = 'none';
    playerUI.classList.add('active');
    isPlaying = true;
    await playChunk(currentChunkIndex);
  });

  // экспорт (по желанию)
  window.startReading = startReading;
  window.stopReading  = stopReading;
  window.nextChunk    = nextChunk;
  window.prevChunk    = prevChunk;
  window.playChunk    = playChunk;
  window.uploadFile   = uploadFile;

  window._dbg = {
    get chunks()       { return chunks; },
    get currentMarks() { return currentMarks; },
    get audioCache()   { return audioCache; },
    get inFlight()     { return inFlight; },
    get controllers()  { return controllers; },
    player,
    inferOffsetUnit,
  };
</script>

</body>
</html>
