<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Читалка (Smart Stream)</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f3f4f6;
      --card-bg: #ffffff;
      --text: #1f2937;
      --text-light: #6b7280;
      --border: #e5e7eb;
      --error: #ef4444;
      --success: #10b981;
      --highlight-bg: #fef08a;
      --highlight-border: #f59e0b;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      width: 100%;
      max-width: 700px;
      transition: all 0.3s ease;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin: 0 0 0.5rem 0;
      color: var(--text);
    }

    p.subtitle {
      color: var(--text-light);
      font-size: 0.95rem;
      margin: 0;
      line-height: 1.5;
    }

    .control-group {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
      color: var(--text);
    }

    textarea {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      resize: vertical;
      min-height: 150px;
      font-family: inherit;
      font-size: 1rem;
      box-sizing: border-box;
      transition: border-color 0.2s;
      line-height: 1.5;
    }

    textarea:focus,
    select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgb(1, 241, 241);
    }

    textarea:disabled {
      background-color: #f9fafb;
      color: #9ca3af;
    }

    select {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      background-color: white;
      font-size: 1rem;
      cursor: pointer;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 0.875rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    button:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    button:active:not(:disabled) {
      transform: translateY(1px);
    }

    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .file-input { display: none; }

    .file-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }

    .file-label {
      cursor: pointer;
      color: var(--primary);
      font-size: 0.9rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 6px;
      transition: background 0.2s;
      background: #eef2ff;
      margin: 0;
      user-select: none;
    }

    .file-label:hover {
      background: #e0e7ff;
    }

    .player-ui {
      margin-top: 20px;
      padding: 20px;
      background: #f8fafc;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      display: none;
      animation: fadeIn 0.4s ease-out;
    }

    .player-ui.active {
      display: block;
    }

    .info {
      font-size: 0.9rem;
      color: var(--text-light);
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-feature-settings: "tnum";
      font-variant-numeric: tabular-nums;
    }

    .book-view {
      background: #fff;
      padding: 2rem;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      margin-bottom: 1rem;
      font-size: 1.15rem;
      line-height: 1.6;
      min-height: 200px;
      white-space: pre-wrap;
      position: relative;

      /* Для устойчивой автопрокрутки внутри блока, без скачков страницы */
      max-height: 360px;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    .w {
      cursor: pointer;
      border-radius: 3px;
      transition: background 0.1s;
      padding: 0 1px;
      display: inline-block;
    }

    .w:hover {
      background: #e0e7ff;
    }

    .w.active {
      background-color: #ffeb3b;
      outline: 2px solid #f59e0b;
      border-radius: 4px;
      color: #000;
      font-weight: bold;
      z-index: 10;
      position: relative;
    }

    .chapter-list {
      max-height: 150px;
      overflow-y: auto;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      margin-top: 10px;
      padding: 5px;
    }

    .chapter-item {
      padding: 8px 10px;
      font-size: 0.85rem;
      border-bottom: 1px solid #f1f5f9;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-light);
      border-radius: 4px;
      user-select: none;
    }

    .chapter-item:hover { background: #f8fafc; color: var(--primary); }

    .chapter-item.active {
      background: #e0e7ff;
      color: var(--primary);
      font-weight: 600;
    }

    .progress-bar {
      height: 8px;
      background: #e2e8f0;
      border-radius: 4px;
      margin: 15px 0;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: width 0.3s ease;
    }

    audio {
      width: 100%;
      height: 40px;
      margin-bottom: 15px;
      border-radius: 8px;
    }

    .controls {
      display: flex;
      gap: 12px;
    }

    .controls button {
      padding: 0.6rem;
      font-size: 0.9rem;
    }

    .btn-secondary { background-color: #64748b; }
    .btn-secondary:hover:not(:disabled) { background-color: #475569; }

    .btn-danger { background-color: var(--error); }
    .btn-danger:hover:not(:disabled) { background-color: #dc2626; }

    .status-message {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.9rem;
      min-height: 1.4em;
      color: var(--primary);
      font-weight: 500;
    }

    .status-message.error { color: var(--error); }
    .status-message.success { color: var(--success); }

    .hint {
      font-size: 0.8rem;
      color: var(--text-light);
      text-align: right;
      margin-top: 0.4rem;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>🔮 Нейро-Читалка</h1>
    <p class="subtitle">Потоковое чтение книг с точной синхронизацией</p>
  </header>

  <div id="inputSection">
    <div class="control-group">
      <div class="file-header">
        <label for="text" style="margin:0;">Текст для чтения</label>
        <label class="file-label">
          <span>📂 Открыть книгу (PDF/FB2)</span>
          <input type="file" id="fileInput" class="file-input" accept=".pdf,.fb2" />
        </label>
      </div>

      <textarea id="text" placeholder="Вставьте длинный текст, главу из книги или просто загрузите файл..."></textarea>
      <div class="hint">Ctrl + Enter для быстрого запуска</div>
    </div>

    <div class="control-group">
      <label for="voice">Голос</label>
      <select id="voice">
        <option value="ru-RU-DmitryNeural" selected>🇷🇺 Дмитрий (Male)</option>
        <option value="ru-RU-SvetlanaNeural">🇷🇺 Светлана (Female)</option>
        <option value="en-US-GuyNeural">🇺🇸 Guy (English, Male)</option>
        <option value="en-US-JennyNeural">🇺🇸 Jenny (English, Female)</option>
      </select>
    </div>

    <button id="startBtn" type="button">
      <span>▶ Начать чтение</span>
    </button>
  </div>

  <div id="status" class="status-message"></div>

  <div id="playerUI" class="player-ui">
    <div class="info">
      <span id="chunkInfo">Фрагмент 0 / 0</span>
      <span id="preloadInfo" style="font-size:0.8rem; opacity:0.8;">Кэш: 0</span>
    </div>

    <div id="bookDisplay" class="book-view"></div>

    <div id="chapterList" class="chapter-list"></div>

    <div class="progress-bar">
      <div id="progress" class="progress-fill"></div>
    </div>

    <audio id="audioPlayer" controls></audio>

    <div class="controls">
      <button id="prevBtn" class="btn-secondary" type="button">⏮ Назад</button>
      <button id="stopBtn" class="btn-danger" type="button">⏹ Стоп</button>
      <button id="nextBtn" class="btn-secondary" type="button">Вперед ⏭</button>
    </div>
  </div>
</div>

<script>
  // ========== КОНФИГУРАЦИЯ ==========
  const CHUNK_SIZE = 1500;
  const PRELOAD_AHEAD = 1;          // сколько чанков заранее подгружать
  const SCROLL_THROTTLE_MS = 250;   // троттлинг автопрокрутки активного слова

  // ========== СОСТОЯНИЕ ==========
  let chunks = [];
  let currentChunkIndex = 0;

  // marks: [{ offset, word, text_offset, word_len, ... }]
  let currentMarks = [];
  let currentWordSpans = [];

  let isPlaying = false;

  // Подсветка
  let lastActiveIndex = -1;
  let markPtr = 0;
  let lastScrollAt = 0;

  // Устойчивость: токен, чтобы игнорировать "поздние" async ответы
  let playToken = 0;

  // Кэш/сеть
  const audioCache = new Map();   // index -> data
  const inFlight = new Map();     // index -> Promise
  const controllers = new Map();  // index -> AbortController

  // ========== DOM ==========
  const $ = (id) => document.getElementById(id);

  const textInput = $('text');
  const fileInput = $('fileInput');
  const startBtn = $('startBtn');
  const inputSection = $('inputSection');

  const statusEl = $('status');
  const playerUI = $('playerUI');
  const player = $('audioPlayer');

  const bookDisplay = $('bookDisplay');
  const chapterList = $('chapterList');

  const voiceSelect = $('voice');

  const chunkInfoEl = $('chunkInfo');
  const preloadInfoEl = $('preloadInfo');
  const progressEl = $('progress');

  const prevBtn = $('prevBtn');
  const nextBtn = $('nextBtn');
  const stopBtn = $('stopBtn');

  // ========== УТИЛИТЫ ==========
  function setStatus(text, kind) {
    statusEl.textContent = text || '';
    statusEl.className = 'status-message' + (kind ? ' ' + kind : '');
  }

  function abortAllRequests() {
    controllers.forEach(c => c.abort());
    controllers.clear();
    inFlight.clear();
  }

  function clearCaches() {
    audioCache.clear();
    updateCacheInfo();
  }

  function resetHighlightState() {
    lastActiveIndex = -1;
    markPtr = 0;
    lastScrollAt = 0;
  }

  function updateProgressUI() {
    chunkInfoEl.textContent = `Фрагмент ${chunks.length ? (currentChunkIndex + 1) : 0} из ${chunks.length}`;
    const percent = chunks.length ? (((currentChunkIndex + 1) / chunks.length) * 100) : 0;
    progressEl.style.width = percent + "%";
  }

  function updateCacheInfo() {
    preloadInfoEl.textContent = `Кэш: ${audioCache.size}`;
  }

  function splitText(text) {
    const sentences = text.match(/[^.!?]+[.!?]+(\s|$)|[^.!?]+$/g) || [text];
    const result = [];
    let currentChunk = "";

    for (const s of sentences) {
      if (currentChunk.length + s.length > CHUNK_SIZE) {
        if (currentChunk.trim()) result.push(currentChunk.trim());
        currentChunk = s;
      } else {
        currentChunk += s;
      }
    }

    if (currentChunk.trim()) result.push(currentChunk.trim());
    return result;
  }

  function renderNavigation() {
    chapterList.innerHTML = '';
    const frag = document.createDocumentFragment();

    chunks.forEach((chunk, idx) => {
      const div = document.createElement('div');
      div.className = 'chapter-item';
      div.dataset.idx = String(idx);
      div.id = `nav-item-${idx}`;
      div.textContent = `${idx + 1}. ${chunk.substring(0, 60)}...`;
      frag.appendChild(div);
    });

    chapterList.appendChild(frag);
  }

  function setNavActive(index) {
    document.querySelectorAll('.chapter-item.active').forEach(el => el.classList.remove('active'));
    const navItem = document.getElementById(`nav-item-${index}`);
    if (navItem) {
      navItem.classList.add('active');
      navItem.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }

  // Бинарный поиск: последний индекс i, где marks[i].offset <= t
  function findMarkIndexByTime(t) {
    const a = currentMarks;
    let lo = 0, hi = a.length - 1, ans = -1;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      if (a[mid].offset <= t) { ans = mid; lo = mid + 1; }
      else hi = mid - 1;
    }
    return ans;
  }

  // ========== РЕНДЕР ТЕКСТА ==========
  function renderInteractiveText(text, marks) {
    bookDisplay.innerHTML = '';
    currentWordSpans = [];

    const frag = document.createDocumentFragment();

    // Точный режим
    if (Array.isArray(marks) && marks.length) {
      let lastIdx = 0;

      for (let i = 0; i < marks.length; i++) {
        const mark = marks[i];

        if (mark.text_offset > lastIdx) {
          frag.appendChild(document.createTextNode(text.substring(lastIdx, mark.text_offset)));
        }

        const wordSpan = document.createElement('span');
        wordSpan.className = 'w';
        wordSpan.dataset.i = String(i);
        wordSpan.textContent = mark.word;
        frag.appendChild(wordSpan);

        currentWordSpans.push(wordSpan);
        lastIdx = mark.text_offset + mark.word_len;
      }

      if (lastIdx < text.length) {
        frag.appendChild(document.createTextNode(text.substring(lastIdx)));
      }

      bookDisplay.appendChild(frag);
      bookDisplay.scrollTop = 0;
      return;
    }

    // Fallback режим
    const words = text.split(/\s+/).filter(Boolean);
    for (let i = 0; i < words.length; i++) {
      const wordSpan = document.createElement('span');
      wordSpan.className = 'w';
      wordSpan.dataset.i = String(i);
      wordSpan.textContent = words[i] + ' ';
      frag.appendChild(wordSpan);
      currentWordSpans.push(wordSpan);
    }

    bookDisplay.appendChild(frag);
    bookDisplay.scrollTop = 0;
  }

  // ========== СЕТЬ ==========
  async function fetchAudio(index) {
    if (index < 0 || index >= chunks.length) return null;
    if (audioCache.has(index)) return audioCache.get(index);
    if (inFlight.has(index)) return inFlight.get(index);

    const promise = (async () => {
      // Отменяем предыдущий запрос именно для этого index (если был)
      controllers.get(index)?.abort();
      const controller = new AbortController();
      controllers.set(index, controller);

      try {
        const response = await fetch('/speak', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          signal: controller.signal,
          body: JSON.stringify({ text: chunks[index], voice: voiceSelect.value })
        });

        if (!response.ok) throw new Error('Ошибка сети или сервера');

        const data = await response.json();
        audioCache.set(index, data);
        updateCacheInfo();
        return data;
      } catch (e) {
        // AbortError — не показываем как "ошибку", это нормальная ситуация при переключении
        if (e && e.name === 'AbortError') return null;
        throw e;
      } finally {
        // Контроллер можно оставить (на случай повторной отмены), но promise удаляем
        inFlight.delete(index);
      }
    })();

    inFlight.set(index, promise);

    try {
      return await promise;
    } catch (e) {
      return null;
    }
  }

  // ========== ПРОИГРЫВАНИЕ ==========
  async function playChunk(index) {
    if (!isPlaying) return;
    if (index < 0 || index >= chunks.length) {
      if (index >= chunks.length) setStatus('Книга прочитана до конца!', 'success');
      return;
    }

    const myToken = ++playToken;

    currentChunkIndex = index;
    resetHighlightState();
    updateProgressUI();
    setNavActive(index);

    setStatus(`Генерация фрагмента ${index + 1}...`, '');

    const data = audioCache.get(index) || await fetchAudio(index);
    if (myToken !== playToken) return;     // устарело (пользователь уже переключил)
    if (!data) {
      setStatus(`Не удалось загрузить часть ${index + 1}.`, 'error');
      return;
    }

    currentMarks = Array.isArray(data.marks) ? data.marks : [];
    renderInteractiveText(chunks[index], currentMarks);

    player.src = data.audio_url;
    setStatus(`Читаю фрагмент ${index + 1}...`, '');

    try {
      await player.play();
    } catch (e) {
      // Автозапуск может быть заблокирован — это не "поломка"
      setStatus('Автозапуск заблокирован браузером. Нажмите Play.', '');
    }

    // Прелоад следующих
    for (let k = 1; k <= PRELOAD_AHEAD; k++) {
      const nextIdx = index + k;
      if (nextIdx < chunks.length) fetchAudio(nextIdx);
    }
  }

  function nextChunk() { playChunk(currentChunkIndex + 1); }
  function prevChunk() { playChunk(currentChunkIndex - 1); }

  function stopReading() {
    isPlaying = false;
    playToken++;            // гасим "поздние" async

    player.pause();
    player.src = "";

    playerUI.classList.remove('active');
    inputSection.style.display = 'block';

    abortAllRequests();
    clearCaches();

    setStatus('Чтение остановлено.', '');
  }

  // ========== ЗАГРУЗКА ФАЙЛА ==========
  async function uploadFile(input) {
    if (!input.files || !input.files[0]) return;

    const file = input.files[0];
    const formData = new FormData();
    formData.append('file', file);

    setStatus('Извлечение текста, подождите...', '');
    textInput.disabled = true;
    startBtn.disabled = true;

    try {
      const res = await fetch('/extract_text', { method: 'POST', body: formData });
      const data = await res.json();

      if (!res.ok) throw new Error(data.error || 'Ошибка обработки файла');

      textInput.value = data.text || '';
      setStatus(`Успешно загружено! Символов: ${textInput.value.length}`, 'success');

      setTimeout(() => { if (!isPlaying) setStatus('', ''); }, 3000);
    } catch (e) {
      setStatus('Ошибка: ' + (e?.message || e), 'error');
    } finally {
      textInput.disabled = false;
      startBtn.disabled = false;
      input.value = '';
    }
  }

  // ========== СТАРТ ==========
  async function startReading() {
    const text = textInput.value.trim();
    if (!text) {
      setStatus('Введите текст или загрузите книгу!', 'error');
      textInput.focus();
      return;
    }

    chunks = splitText(text);
    if (!chunks.length) return;

    // Полный сброс сетевого/кэш состояния
    playToken++;
    abortAllRequests();
    clearCaches();

    currentChunkIndex = 0;
    isPlaying = true;

    renderNavigation();

    inputSection.style.display = 'none';
    playerUI.classList.add('active');

    setStatus('Подготовка аудиопотока...', '');
    updateProgressUI();
    updateCacheInfo();

    await playChunk(0);
  }

  // ========== СОБЫТИЯ UI ==========
  startBtn.addEventListener('click', startReading);

  prevBtn.addEventListener('click', prevChunk);
  nextBtn.addEventListener('click', nextChunk);
  stopBtn.addEventListener('click', stopReading);

  fileInput.addEventListener('change', (e) => uploadFile(e.target));

  textInput.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      e.preventDefault();
      startReading();
    }
  });

  // Оглавление — делегирование клика
  chapterList.addEventListener('click', (e) => {
    const item = e.target.closest('.chapter-item');
    if (!item) return;
    const idx = Number(item.dataset.idx);
    if (Number.isFinite(idx)) playChunk(idx);
  });

  // Клик по слову — делегирование
  bookDisplay.addEventListener('click', (e) => {
    const el = e.target.closest('.w');
    if (!el) return;

    const i = Number(el.dataset.i);
    if (!Number.isFinite(i)) return;

    if (currentMarks.length) {
      const m = currentMarks[i];
      if (m && typeof m.offset === 'number') {
        player.currentTime = m.offset;
        player.play().catch(() => {});
      }
      return;
    }

    if (player.duration > 0 && currentWordSpans.length) {
      player.currentTime = player.duration * (i / currentWordSpans.length);
      player.play().catch(() => {});
    }
  });

  // Если меняют голос во время чтения — сброс кэша/запросов, переиграть текущий фрагмент
  voiceSelect.addEventListener('change', () => {
    if (!isPlaying || !chunks.length) return;

    playToken++;
    abortAllRequests();
    clearCaches();
    resetHighlightState();

    setStatus('Голос изменён — перегенерирую текущий фрагмент...', '');
    playChunk(currentChunkIndex);
  });

  // ========== МЕДИА-СОБЫТИЯ ==========
  player.addEventListener('ended', () => {
    if (isPlaying) playChunk(currentChunkIndex + 1);
  });

  player.addEventListener('timeupdate', () => {
    const t = player.currentTime;
    let idx = -1;

    if (currentMarks.length) {
      // Перемотка назад — пересчёт
      if (markPtr < currentMarks.length && t < currentMarks[markPtr]?.offset) {
        markPtr = Math.max(0, findMarkIndexByTime(t));
      } else {
        // Нормальный ход вперёд
        while (markPtr + 1 < currentMarks.length && t >= currentMarks[markPtr + 1].offset) {
          markPtr++;
        }
      }
      idx = Math.min(markPtr, currentMarks.length - 1);
    } else if (currentWordSpans.length && player.duration > 0) {
      idx = Math.floor((t / player.duration) * currentWordSpans.length);
      idx = Math.max(0, Math.min(idx, currentWordSpans.length - 1));
    }

    if (idx === -1 || idx === lastActiveIndex) return;

    // Снять старую подсветку
    if (lastActiveIndex !== -1) currentWordSpans[lastActiveIndex]?.classList.remove('active');

    // Поставить новую
    lastActiveIndex = idx;
    const el = currentWordSpans[idx];
    if (!el) return;
    el.classList.add('active');

    // Автопрокрутка (троттлинг + без smooth, чтобы не копить анимации)
    const now = performance.now();
    if (now - lastScrollAt > SCROLL_THROTTLE_MS) {
      el.scrollIntoView({ block: 'nearest' });
      lastScrollAt = now;
    }
  });

  // Экспорт в window (если нужно дергать из консоли/старых inline-хендлеров)
  window.startReading = startReading;
  window.stopReading = stopReading;
  window.nextChunk = nextChunk;
  window.prevChunk = prevChunk;
  window.playChunk = playChunk;
  window.uploadFile = uploadFile;
</script>
